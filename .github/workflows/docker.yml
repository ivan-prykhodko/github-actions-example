name: docker

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: linux-amd64
          #- platform: linux/arm64
          #  runner: ubuntu-24.04-arm
          #  artifact: linux-arm64
    runs-on: ${{ matrix.runner }}
    environment: development
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        persist-credentials: false
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
        password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}
    #- name: Set up QEMU
    #  uses: docker/setup-qemu-action@v4
    #  with:
    #    platforms: linux/amd64,linux/arm64
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Collect metadata
      run: |
        echo "GIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        push: true
        target: app_prod
        tags: |
          ${{ vars.DOCKER_APP_IMAGE_REPOSITORY_NAME }}:${{ github.ref_name }}
          ${{ vars.DOCKER_APP_IMAGE_REPOSITORY_NAME }}:latest
        #platforms: linux/amd64,linux/arm64
        platforms: ${{ matrix.platform }}
        labels: |
          org.opencontainers.image.title=GitHub Actions Example
          org.opencontainers.image.description=Example application for GitHub Actions
          org.opencontainers.image.url=https://github.com/ivan-prykhodko/github-actions-example
          org.opencontainers.image.source=https://github.com/ivan-prykhodko/github-actions-example
          org.opencontainers.image.documentation=https://github.com/ivan-prykhodko/github-actions-example/blob/main/README.md
          org.opencontainers.image.vendor=Ivan Prykhodko
          org.opencontainers.image.licenses=MIT
          org.opencontainers.image.revision=${{ env.GIT_SHA }}
          org.opencontainers.image.version=${{ github.ref_name }}
          org.opencontainers.image.created=${{ env.BUILD_DATE }}
